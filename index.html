<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2060 Mission Control</title>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:Arial;
text-align:center;
padding:30px 15px;
}

button{
background:#00d084;
border:0;
padding:18px 35px;
border-radius:10px;
font-size:20px;
font-weight:bold;
}

#countdown{
font-size:70px;
font-weight:bold;
color:#00ff99;
height:100px;
}

#rocket{
font-size:60px;
margin-top:150px;
}

.fly{
animation:launch 5s linear forwards;
}

@keyframes launch{

from{
transform:translateY(0);
}

to{
transform:translateY(-400px);
}

}

</style>

</head>

<body>

<h1>🚀 2060 MISSION CONTROL</h1>

<p id="status">
SYSTEM READY
</p>

<div id="countdown"></div>

<button id="launchButton">
🚀 LAUNCH
</button>

<div id="rocket">
🚀
</div>


<script>

const button =
document.getElementById("launchButton");

const countdown =
document.getElementById("countdown");

const rocket =
document.getElementById("rocket");

const status =
document.getElementById("status");


button.onclick = function(){

button.disabled = true;

status.innerText =
"COUNTDOWN STARTED";

let number = 3;

countdown.innerText =
number;


let timer =
setInterval(function(){

number--;

if(number > 0){

countdown.innerText =
number;

}

else{

clearInterval(timer);

countdown.innerText =
"🚀";

status.innerText =
"LIFTOFF!";

rocket.classList.add("fly");

}

},1000);

};

</script>

</body>
</html>
