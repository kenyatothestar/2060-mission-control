<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>2060 Mission Control V2.4.2</title>

<style>

body{
    margin:0;
    background:#020617;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:30px 15px;
}

h1{
    font-size:26px;
}

#status{
    font-size:20px;
    font-weight:bold;
    color:#00ff99;
    margin:15px;
}

#countdown{
    font-size:70px;
    font-weight:bold;
    color:#00ff99;
    height:100px;
}

button{
    background:#00d084;
    color:#001b10;
    border:0;
    padding:18px 35px;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
}

button:disabled{
    opacity:.5;
}

#space{
    height:500px;
    margin-top:20px;
    position:relative;
    overflow:hidden;
    border:2px solid #334155;
    border-radius:15px;
    background:#030712;
}

#rocket{
    position:absolute;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    font-size:60px;
}

.fly{
    animation:launch 5s linear forwards;
}

@keyframes launch{

    from{
        bottom:30px;
        transform:translateX(-50%);
    }

    to{
        bottom:430px;
        transform:translateX(-50%);
    }

}

.telemetry{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:20px;
}

.card{
    padding:18px;
    background:#081226;
    border:1px solid #263858;
    border-radius:12px;
}

.card small{
    display:block;
    color:#94a
