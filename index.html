<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>2060 Mission Control</title>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:Arial,sans-serif;
text-align:center;
padding:25px 15px;
}

h1{
font-size:25px;
}

#status{
font-size:20px;
font-weight:bold;
color:#00ff99;
margin:15px;
}

#countdown{
font-size:70px;
font-weight:bold;
color:#00ff99;
height:100px;
}

button{
background:#00d084;
border:0;
padding:18px 35px;
border-radius:10px;
font-size:20px;
font-weight:bold;
}

button:disabled{
opacity:.5;
}

#rocket{
font-size:60px;
margin-top:150px;
}

.fly{
animation:launch 5s linear forwards;
}

@keyframes launch{

from{
transform:translateY(0);
}

to{
transform:translateY(-400px);
}

}


/* TELEMETRY */

.telemetry{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:30px;
}

.card{
background:#081226;
border:1px solid #263858;
border-radius:12px;
padding:15px;
}

.card small{
color:#94a3b8;
}

.card strong{
display:block;
font-size:22px;
margin-top:8px;
}

#fuelBar{
height:8px;
background:#00d084;
width:100%;
margin-top:10px;
border-radius:10px;
}

@media(max-width:600px){

.telemetry{
grid-template-columns:1fr;
}

}

</style>

</head>


<body>


<h1>
🚀 2060 MISSION CONTROL
</h1>


<p id="status">
SYSTEM READY
</p>


<div id="countdown"></div>


<button id="launchButton">
🚀 LAUNCH
</button>


<div id="rocket">
🚀
</div>
