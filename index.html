<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2060 Mission Control V1.9</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#030712;
color:#fff;
font-family:Arial,sans-serif;
}
header{
background:#080f20;
padding:18px;
text-align:center;
border-bottom:1px solid #243454;
}
header h1{margin:0;font-size:24px;letter-spacing:2px}
header p{margin:7px 0 0;color:#8193b5;font-size:13px}

.container{max-width:1100px;margin:auto;padding:14px}

.status{
background:#080f20;
border:1px solid #243454;
border-radius:12px;
padding:15px;
text-align:center;
margin-bottom:14px;
}

#status{color:#00ff9d;font-weight:bold}

.stage{
background:#080f20;
border:1px solid #243454;
border-radius:14px;
height:420px;
position:relative;
overflow:hidden;
margin-bottom:14px;
}

.stars{
position:absolute;
inset:0;
background-image:
radial-gradient(#fff 1px,transparent 1px),
radial-gradient(#fff 1px,transparent 1px);
background-size:90px 90px,140px 140px;
background-position:10px 20px,40px 70px;
opacity:.55;
}

.earth{
position:absolute;
width:260px;
height:260px;
border-radius:50%;
bottom:-140px;
left:50%;
transform:translateX(-50%);
background:radial-gradient(circle at 35% 30%,#55aaff,#1551a5 55%,#06132e);
box-shadow:0 0 70px #1658b8;
}

.orbit{
position:absolute;
width:350px;
height:180px;
border:2px dashed #496b9f;
border-radius:50%;
left:50%;
top:100px;
transform:translateX(-50%);
display:none;
}

.rocket{
position:absolute;
left:50%;
bottom:75px;
transform:translateX(-50%);
font-size:58px;
z-index:5;
}

.flame{
display:none;
font-size:32px;
text-align:center;
animation:flame .12s infinite alternate;
}

@keyframes flame{
from{transform:scale(.8)}
to{transform:scale(1.2)}
}

.launching{
animation:shake .12s infinite alternate;
}

@keyframes shake{
from{margin-left:-3px}
to{margin-left:3px}
}

.countdown{
display:none;
position:absolute;
inset:0;
z-index:10;
align-items:center;
justify-content:center;
font-size:100px;
font-weight:bold;
color:#00ff9d;
text-shadow:0 0 30px #00ff9d;
}

.controls{
display:flex;
gap:10px;
margin-bottom:14px;
flex-wrap:wrap;
}

button{
flex:1;
min-width:120px;
padding:14px;
border:0;
border-radius:10px;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

#launch{background:#00d084;color:#001b10}
#abort{background:#ef4444;color:white}
#reset{background:#263653;color:white}

button:disabled{
opacity:.4;
cursor:not-allowed;
}

.telemetry{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:14px;
}

.card{
background:#080f20;
border:1px solid #243454;
border-radius:12px;
padding:15px;
}

.card small{color:#8193b5}
.card strong{
display:block;
font-size:21px;
margin-top:7px;
}

.graph{
background:#080f20;
border:1px solid #243454;
border-radius:12px;
padding:15px;
margin-bottom:14px;
}

canvas{
width:100%;
height:180px;
background:#030712;
border-radius:8px;
}

.alert{
background:#080f20;
border:1px solid #243454;
border-radius:12px;
padding:15px;
margin-bottom:14px;
}

#alertBox{
color:#8cffc8;
font-family:monospace;
}

.log{
background:#080f20;
border:1px solid #243454;
border-radius:12px;
padding:15px;
}

.log h2{font-size:18px;margin-top:0}

#log{
height:170px;
overflow:auto;
background:#030712;
border-radius:8px;
padding:10px;
font-family:monospace;
font-size:12px;
}

.entry{
margin-bottom:7px;
color:#9fffd3;
}

@media(max-width:700px){
.telemetry{grid-template-columns:repeat(2,1fr)}
.stage{height:380px}
}
</style>
</head>

<body>

<header>
<h1>2060 MISSION CONTROL</h1>
<p>Aerospace Launch Simulation • V1.9</p>
</header>

<div class="container">

<div class="status">
MISSION STATUS:
<span id="status">STANDBY</span>
</div>

<div class="stage">

<div class="stars"></div>

<div id="countdown" class="countdown">3</div>

<div id="orbit" class="orbit"></div>

<div id="rocket" class="rocket">
🚀
<div id="flame" class="flame">🔥</div>
</div>

<div class="earth"></div>

</div>

<div class="controls">
<button id="launch">🚀 LAUNCH</button>
<button id="abort" disabled>⛔ ABORT</button>
<button id="reset">↻ RESET</button>
</div>

<div class="telemetry">

<div class="card">
<small>ALTITUDE</small>
<strong><span id="altitude">0</span> km</strong>
</div>

<div class="card">
<small>SPEED</small>
<strong><span id="speed">0</span> km/h</strong>
</div>

<div class="card">
<small>FUEL</small>
<strong><span id="fuel">100</span>%</strong>
</div>

<div class="card">
<small>MISSION TIME</small>
<strong id="time">00:00</strong>
</div>

</div>

<div class="graph">
<h3>LIVE TELEMETRY</h3>
<canvas id="graph" width="900" height="180"></canvas>
</div>

<div class="alert">
<h3>📡 SYSTEM ALERTS</h3>
<div id="alertBox">SYSTEM READY — ALL SYSTEMS NOMINAL</div>
</div>

<div class="log">
<h2>📝 MISSION LOG</h2>
