<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2060 Mission Control</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050816;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

header {
  background: #0b1025;
  padding: 18px;
  text-align: center;
  border-bottom: 1px solid #24304f;
}

header h1 {
  margin: 0;
  font-size: 25px;
  letter-spacing: 2px;
}

header p {
  margin: 6px 0 0;
  color: #8fa3c7;
  font-size: 13px;
}

.dashboard {
  max-width: 1100px;
  margin: auto;
  padding: 15px;
}

.status {
  background: #0b1025;
  border: 1px solid #24304f;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
  text-align: center;
}

.status span {
  font-weight: bold;
}

#missionStatus {
  color: #00ff99;
}

.launch-area {
  position: relative;
  height: 430px;
  background:
    radial-gradient(circle at 20% 20%, #ffffff 1px, transparent 2px),
    radial-gradient(circle at 70% 30%, #ffffff 1px, transparent 2px),
    radial-gradient(circle at 40% 70%, #ffffff 1px, transparent 2px),
    #02040c;
  background-size: 120px 120px;
  border: 1px solid #24304f;
  border-radius: 15px;
  overflow: hidden;
  margin-bottom: 15px;
}

.planet {
  position: absolute;
  bottom: -100px;
  left: 50%;
  transform: translateX(-50%);
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #3c8cff, #102c72 55%, #030816);
  box-shadow: 0 0 70px #174bba;
}

.rocket {
  position: absolute;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 60px;
  z-index: 5;
  transition: bottom 0.2s linear;
}

.flame {
  position: absolute;
  top: 57px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 35px;
  display: none;
  animation: flame 0.15s infinite alternate;
}

@keyframes flame {
  from { transform: translateX(-50%) scale(0.8); }
  to { transform: translateX(-50%) scale(1.2); }
}

.rocket.launching {
  animation: rocketShake 0.12s infinite alternate;
}

@keyframes rocketShake {
  from { margin-left: -3px; }
  to { margin-left: 3px; }
}

.countdown {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 100px;
  font-weight: bold;
  color: #00ff99;
  text-shadow: 0 0 30px #00ff99;
  z-index: 10;
}

.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}

button {
  flex: 1;
  min-width: 120px;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#launchBtn {
  background: #00d084;
  color: #001b10;
}

#abortBtn {
  background: #ff4d4d;
  color: white;
}

#resetBtn {
  background: #253252;
  color: white;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.telemetry {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 15px;
}

.card {
  background: #0b1025;
  border: 1px solid #24304f;
  border-radius: 12px;
  padding: 15px;
}

.card small {
  color: #8fa3c7;
}

.card strong {
  display: block;
  margin-top: 8px;
  font-size: 22px;
}

.log {
  background: #0b1025;
  border: 1px solid #24304f;
  border-radius: 12px;
  padding: 15px;
}

.log h2 {
  margin-top: 0;
  font-size: 18px;
}

#missionLog {
  height: 170px;
  overflow-y: auto;
  background: #02040c;
  padding: 10px;
  border-radius: 8px;
  font-family: monospace;
  font-size: 13px;
}

.log-entry {
  margin-bottom: 8px;
  color: #9effd1;
}

@media (max-width: 700px) {
  .telemetry {
    grid-template-columns: repeat(2, 1fr);
  }

  .launch-area {
    height: 380px;
  }
}
</style>
</head>

<body>

<header>
  <h1>2060 MISSION CONTROL</h1>
  <p>Aerospace Launch Simulation • V1.8.1</p>
</header>

<div class="dashboard">

  <div class="status">
    MISSION STATUS:
    <span id="missionStatus">STANDBY</span>
  </div>

  <div class="launch-area">

    <div id="countdown" class="countdown">3</div>

    <div id="rocket" class="rocket">
      🚀
      <div id="flame" class="flame">🔥</div>
    </div>

    <div class="planet"></div>

  </div>

  <div class="controls">
    <button id="launchBtn">🚀 LAUNCH</button>
    <button id="abortBtn" disabled>⛔ ABORT</button>
    <button id="resetBtn">↻ RESET</button>
  </div>

  <div class="telemetry">

    <div class="card">
      <small>ALTITUDE</small>
      <strong><span id="altitude">0</span> km</strong>
    </div>

    <div class="card">
      <small>SPEED</small>
      <strong><span id="speed">0</span> km/h</strong>
    </div>

    <div class="card">
      <small>FUEL</small>
      <strong><span id="fuel">100</span>%</strong>
    </div>

    <div class="card">
      <small>MISSION TIME</small>
      <strong><span id="missionTime">00:00</span></strong>
    </div>

  </div>

  <div class="log">

    <h2>MISSION LOG</h2>

    <div id="missionLog">
      <div class="log-entry">
        [SYSTEM] Mission Control initialized.
      </div>

      <div class="log-entry">
        [SYSTEM] Vehicle standing by.
      </div>
    </div>

  </div>

</div>

<script>

let countdownTimer = null;
let telemetryTimer = null;
let missionSeconds = 0;

let altitude = 0;
let speed = 0;
let fuel = 100;

let launching = false;
let aborted = false;

const launchBtn = document.getElementById("launchBtn");
const abortBtn = document.getElementById("abortBtn");
const resetBtn = document.getElementById("resetBtn");

const missionStatus = document.getElementById("missionStatus");
const countdown = document.getElementById("countdown");

const rocket = document.getElementById("rocket");
const flame = document.getElementById("flame");

const altitudeEl = document.getElementById("altitude");
const speedEl = document.getElementById("speed");
const fuelEl = document.getElementById("fuel");
const missionTimeEl = document.getElementById("missionTime");

const missionLog = document.getElementById("missionLog");

function logMessage(message) {

  const entry = document.createElement("div");

  entry.className = "log-entry";

  const time = new Date().toLocaleTimeString();

  entry.textContent = "[" + time + "] " + message;

  missionLog.appendChild(entry);

  missionLog.scrollTop = missionLog.scrollHeight;
}

function updateTelemetry() {

  altitudeEl.textContent = Math.floor(altitude);

  speedEl.textContent = Math.floor(speed);

  fuelEl.textContent = Math.max(0, fuel).toFixed(1);

  const minutes = Math.floor(missionSeconds / 60);

  const seconds = missionSeconds % 60;

  missionTimeEl.textContent =
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0");
}

function startCountdown() {

  launching = true;

  aborted = false;

  launchBtn.disabled = true;

  abortBtn.disabled = false;

  missionStatus.textContent = "COUNTDOWN";

  missionStatus.style.color = "#ffd166";

  logMessage("Launch sequence initiated.");

  countdown.style.display = "flex";

  let number = 3;

  countdown.textContent = number;

  countdownTimer = setInterval(() => {

    number--;

    if (number > 0) {

      countdown.textContent = number;

      logMessage("T-" + number);

    } else {

      clearInterval(countdownTimer);

      countdown.style.display = "none";

      beginLaunch();

    }

  }, 1000);
}

function beginLaunch() {

  if (aborted) return;

  missionStatus.textContent = "LIFTOFF";

  missionStatus.style.color = "#00ff99";

  flame.style.display = "block";

  rocket.classList.add("launching");

  logMessage("ENGINE IGNITION.");

  setTimeout(() => {

    logMessage("LIFTOFF CONFIRMED.");

  }, 700);

  setTimeout(() => {

    missionStatus.textContent = "IN FLIGHT";

    logMessage("Vehicle ascending.");

  }, 1500);

  telemetryTimer = setInterval(() => {

    missionSeconds++;

    altitude += 1.8;

    speed += 320;

    fuel -= 0.45;

    let rocketBottom =
      85 + missionSeconds * 12;

    rocket.style.bottom =
      Math.min(370, rocketBottom) + "px";

    updateTelemetry();

    if (fuel <= 0) {

      completeMission();

    }

  }, 1000);

}

function abortMission() {

  if (!launching) return;

  aborted = true;

  launching = false;

  clearInterval(countdownTimer);

  clearInterval(telemetryTimer);

  countdown.style.display = "none";

  flame.style.display = "none";

  rocket.classList.remove("launching");

  missionStatus.textContent = "ABORTED";

  missionStatus.style.color = "#ff4d4d";

  launchBtn.disabled = true;

  abortBtn.disabled = true;

  logMessage("⚠ LAUNCH ABORTED.");

}

function completeMission() {

  clearInterval(telemetryTimer);

  launching = false;

  flame.style.display = "none";

  rocket.classList.remove("launching");

  missionStatus.textContent = "MISSION COMPLETE";

  missionStatus.style.color = "#00ff99";

  abortBtn.disabled = true;

  logMessage("MISSION COMPLETE.");

}

function resetMission() {

  clearInterval(countdownTimer);

  clearInterval(telemetryTimer);

  launching = false;

  aborted = false;

  missionSeconds = 0;

  altitude = 0;

  speed = 0;

  fuel = 100;

  countdown.style.display = "none";

  flame.style.display = "none";

  rocket.classList.remove("launching");

  rocket.style.bottom = "85px";

  missionStatus.textContent = "STANDBY";

  missionStatus.style.color = "#00ff99";

  launchBtn.disabled = false;

  abortBtn.disabled = true;

  missionLog.innerHTML = "";

  logMessage("Mission Control reset.");

  logMessage("Vehicle ready for launch.");

  updateTelemetry();

}

launchBtn.addEventListener("click", startCountdown);

abortBtn.addEventListener("click", abortMission);

resetBtn.addEventListener("click", resetMission);

updateTelemetry();

</script>

</body>
</html>
