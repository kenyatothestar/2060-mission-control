<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>2060 Mission Control</title>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:Arial,sans-serif;
text-align:center;
padding:30px 15px;
}

h1{
font-size:26px;
}

#status{
font-size:20px;
font-weight:bold;
color:#00ff99;
margin:15px;
}

#countdown{
font-size:70px;
font-weight:bold;
color:#00ff99;
height:100px;
}

button{
background:#00d084;
color:#001b10;
border:0;
padding:18px 35px;
border-radius:10px;
font-size:20px;
font-weight:bold;
}

button:disabled{
opacity:.5;
}

#rocket{
font-size:60px;
margin-top:150px;
}

.fly{
animation:launch 5s linear forwards;
}

@keyframes launch{

from{
transform:translateY(0);
}

to{
transform:translateY(-400px);
}

}

.telemetry{
margin-top:30px;
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.card{
padding:18px;
background:#081226;
border:1px solid #263858;
border-radius:12px;
}

.label{
color:#94a3b8;
font-size:14px;
}

.value{
display:block;
margin-top:8px;
font-size:24px;
color:#38bdf8;
}

@media(max-width:500px){

.telemetry{
grid-template-columns:1fr;
}

}

</style>

</head>


<body>


<h1>
🚀 2060 MISSION CONTROL
</h1>


<p id="status">
SYSTEM READY
</p>


<div id="countdown"></div>


<button id="launchButton">
🚀 LAUNCH
</button>


<div id="rocket">
🚀
</div>


<div class="telemetry">


<div class="card">

<div class="label">
ALTITUDE
</div>

<span id="altitude"
class="value">
0 km
</span>

</div>


<div class="card">

<div class="label">
SPEED
</div>

<span id="speed"
class="value">
0 km/h
</span>

</div>


</div>


<script>


const button =
document.getElementById("launchButton");

const countdown =
document.getElementById("countdown");

const rocket =
document.getElementById("rocket");

const status =
document.getElementById("status");

const altitudeDisplay =
document.getElementById("altitude");

const speedDisplay =
document.getElementById("speed");


let altitude = 0;

let speed = 0;

let altitudeTimer = null;

let speedTimer = null;
