<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2060 Mission Control V2.2</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#02050c;
color:#fff;
font-family:Arial,sans-serif;
}

header{
background:#081226;
padding:18px;
text-align:center;
border-bottom:1px solid #263858;
}

header h1{
margin:0;
font-size:24px;
letter-spacing:2px;
}

header p{
margin:7px 0 0;
color:#8da0c2;
font-size:13px;
}

.container{
max-width:1150px;
margin:auto;
padding:14px;
}

.status{
background:#081226;
border:1px solid #263858;
border-radius:12px;
padding:15px;
text-align:center;
margin-bottom:14px;
}

#status{
color:#00ff99;
font-weight:bold;
}

.map{
height:430px;
position:relative;
overflow:hidden;
background:#01040a;
border:1px solid #263858;
border-radius:15px;
margin-bottom:14px;
}

.stars{
position:absolute;
inset:0;
background-image:
radial-gradient(#fff 1px,transparent 1px),
radial-gradient(#fff 1px,transparent 1px);
background-size:80px 80px,130px 130px;
opacity:.45;
}

.earth{
position:absolute;
width:250px;
height:250px;
border-radius:50%;
left:50%;
bottom:-130px;
transform:translateX(-50%);
background:
radial-gradient(circle at 35% 30%,#62b6ff,#1d5eb6 50%,#061631 75%);
box-shadow:0 0 80px #1264d8;
}

.orbit{
position:absolute;
width:370px;
height:190px;
left:50%;
top:100px;
transform:translateX(-50%);
border:2px dashed #48658f;
border-radius:50%;
}

#trajectory{
position:absolute;
inset:0;
width:100%;
height:100%;
z-index:3;
pointer-events:none;
}

.rocket{
position:absolute;
left:50%;
bottom:70px;
transform:translateX(-50%);
font-size:55px;
z-index:5;
transition:all .8s linear;
}

.flame{
display:none;
font-size:30px;
text-align:center;
}

#countdown{
display:none;
position:absolute;
top:120px;
left:0;
right:0;
font-size:90px;
font-weight:bold;
color:#00ff99;
text-shadow:0 0 30px #00ff99;
z-index:20;
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:14px;
}

button{
flex:1;
min-width:120px;
padding:14px;
border:0;
border-radius:10px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

#launch{
background:#00d084;
color:#001b10;
}

#abort{
background:#ef4444;
color:#fff;
}

#reset{
background:#344563;
color:#fff;
}

button:disabled{
opacity:.4;
cursor:not-allowed;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:14px;
}

.card{
background:#081226;
border:1px solid #263858;
border-radius:12px;
padding:15px;
}

.card small{
color:#8da0c2;
}

.card strong{
display:block;
font-size:20px;
margin-top:7px;
}

.progress{
height:8px;
background:#1a2944;
border-radius:10px;
overflow:hidden;
margin-top:9px;
}

.bar{
height:100%;
width:100%;
background:#00d084;
transition:width .5s;
}

.panel{
background:#081226;
border:1px solid #263858;
border-radius:12px;
padding:15px;
margin-bottom:14px;
}

.panel h3{
margin-top:0;
}

.tracking{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.track{
background:#02050c;
border:1px solid #263858;
border-radius:9px;
padding:13px;
}

.track small{
color:#8da0c2;
}

.track strong{
display:block;
margin-top:6px;
font-size:18px;
}

.systems{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.system{
background:#02050c;
padding:13px;
border-radius:9px;
border:1px solid #263858;
}

.system span{
display:block;
margin-top:7px;
font-weight:bold;
color:#00ff99;
}

canvas.graph{
width:100%;
height:190px;
background:#02050c;
border-radius:8px;
}

.timeline{
border-left:2px solid #263858;
padding-left:15px;
}

.event{
margin-bottom:13px;
color:#9fffd3;
}

.event b{
color:#fff;
}

.alert{
font-family:monospace;
color:#9fffd3;
}

.log{
height:170px;
overflow:auto;
background:#02050c;
border-radius:8px;
padding:10px;
font-family:monospace;
font-size:12px;
}

.logline{
margin-bottom:7px;
color:#9fffd3;
}

@media(max-width:700px){

.grid{
grid-template-columns:repeat(2,1fr);
}

.tracking,
.systems{
grid-template-columns:1fr;
}

.map{
height:390px;
}

.orbit{
width:310px;
}

}
</style>
</head>

<body>

<header>
<h1>🚀 2060 MISSION CONTROL</h1>
<p>Aerospace Operations & Tracking • V2.2</p>
</header>

<div class="container">

<div class="status">
MISSION STATUS:
<span id="status">STANDBY</span>
</div>

<div class="map">

<div class="stars"></div>

<div id="countdown">3</div>

<div class="orbit"></div>

<canvas id="trajectory"></canvas>

<div id="rocket" class="rocket">
🚀
<div id="flame" class="flame">🔥</div>
</div>

<div class="earth"></div>

</div>

<div class="controls">

<button id="launch">🚀 LAUNCH</button>

<button id="abort" disabled>⛔ ABORT</button>

<button id="reset">↻ RESET</button>

</div>

<div class="grid">

<div class="card">
<small>ALTITUDE</small>
<strong><span id="altitude">0</span> km</strong>
</div>

<div class="card">
<small>SPEED</small>
<strong><span id="speed">0</span> km/h</strong>
</div>

<div class="card">
<small>FUEL</small>
<strong><span id="fuel">100</span>%</strong>
<div class="progress">
<div id="fuelBar" class="bar"></div>
</div>
</div>

<div class="card">
<small>COMMUNICATION</small>
<strong><span id="signal">100</span>%</strong>
<div class="progress">
<div id="signalBar" class="bar"></div>
</div>
</div>

</div>

<div class="panel">

<h3>🛰 SPACECRAFT TRACKING</h3>

<div class="tracking">

<div class="track">
<small>LATITUDE</small>
<strong id="latitude">0.000°</strong>
</div>

<div class="track">
<small>LONGITUDE</small>
<strong id="longitude">0.000°</strong>
</div>

<div class="track">
<small>GROUND STATION</small>
<strong id="station">NAIROBI</strong>
</div>

<div class="track">
<small>TRAJECTORY</small>
<strong id="trajectoryStatus">STANDBY</strong>
</div>

<div class="track">
<small>TARGET ORBIT</small
