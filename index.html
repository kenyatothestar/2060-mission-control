<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>2060 Mission Control</title>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:Arial;
text-align:center;
}

h1{
margin:20px;
}

button{
padding:15px 30px;
font-size:18px;
font-weight:bold;
border:0;
border-radius:10px;
background:#00d084;
}

#status{
margin:15px;
font-size:20px;
color:#00ff99;
}

#countdown{
font-size:70px;
font-weight:bold;
color:#00ff99;
height:90px;
}

#space{
height:500px;
margin:20px;
border:2px solid #334155;
border-radius:15px;
position:relative;
overflow:hidden;
background:#030712;
}

#rocket{
position:absolute;
left:50%;
bottom:30px;
transform:translateX(-50%);
font-size:60px;
}

#rocket.fly{
animation:fly 5s linear forwards;
}

@keyframes fly{

from{
bottom:30px;
}

to{
bottom:430px;
}

}

#log{
margin:20px;
padding:15px;
background:#081226;
border-radius:10px;
text-align:left;
}

</style>

</head>

<body>

<h1>🚀 2060 MISSION CONTROL</h1>

<div id="status">
STANDBY
</div>

<div id="countdown"></div>

<button id="launch">
🚀 LAUNCH
</button>

<div id="space">

<div id="rocket">
🚀
</div>

</div>

<div id="log">
MISSION READY
</div>


<script>

const button =
document.getElementById("launch");

const rocket =
document.getElementById("rocket");

const status =
document.getElementById("status");

const countdown =
document.getElementById("countdown");

const log =
document.getElementById("log");


button.onclick = function(){

button.disabled = true;

status.innerHTML =
"COUNTDOWN";

let count = 3;

countdown.innerHTML =
count;

let timer =
setInterval(function(){

count--;

if(count > 0){

countdown.innerHTML =
count;

}

else{

clearInterval(timer);

countdown.innerHTML =
"🚀";

status.innerHTML =
"LIFTOFF";

log.innerHTML +=
"<br>ENGINE IGNITION";

log.innerHTML +=
"<br>🚀 LIFTOFF CONFIRMED";


rocket.classList.remove("fly");

void rocket.offsetWidth;

rocket.classList.add("fly");

}

},1000);

};

</script>

</body>
</html>
