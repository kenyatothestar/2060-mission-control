<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
background:#020617;
color:white;
font-family:Arial;
text-align:center;
}

button{
padding:15px 30px;
font-size:18px;
font-weight:bold;
background:#00d084;
border:0;
border-radius:10px;
}

#status{
margin:20px;
font-size:20px;
color:#00ff99;
}

#space{
height:500px;
margin:20px;
border:2px solid #334155;
border-radius:15px;
position:relative;
overflow:hidden;
}

#rocket{
position:absolute;
left:50%;
bottom:30px;
transform:translateX(-50%);
font-size:60px;
}

#rocket.fly{
animation:fly 5s linear forwards;
}

@keyframes fly{
from{
bottom:30px;
}

to{
bottom:430px;
}
}

#log{
margin:20px;
padding:15px;
background:#081226;
border-radius:10px;
text-align:left;
}
</style>
</head>

<body>

<h1>🚀 2060 MISSION CONTROL</h1>

<div id="status">STANDBY</div>

<button id="launch">🚀 LAUNCH</button>

<div id="space">

<div id="rocket">🚀</div>

</div>

<div id="log">
MISSION READY
</div>

<script>

const button = document.getElementById("launch");
const rocket = document.getElementById("rocket");
const status = document.getElementById("status");
const log = document.getElementById("log");

button.addEventListener("click", function(){

status.textContent = "🚀 LIFTOFF";

log.innerHTML += "<br>ENGINE IGNITION";
log.innerHTML += "<br>ROCKET LAUNCHED";

rocket.classList.remove("fly");

void rocket.offsetWidth;

rocket.classList.add("fly");

});

</script>

</body>
</html>
