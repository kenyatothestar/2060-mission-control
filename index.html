<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>2060 Mission Control</title>

<style>

body{
    margin:0;
    background:#020617;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:20px 12px;
}

h1{
    font-size:27px;
}

#status{
    font-size:20px;
    font-weight:bold;
    color:#00ff99;
    margin:15px;
}

#countdown{
    height:80px;
    font-size:60px;
    font-weight:bold;
    color:#00ff99;
}

button{
    border:0;
    border-radius:10px;
    padding:16px 25px;
    font-size:18px;
    font-weight:bold;
    margin:5px;
}

#launchButton{
    background:#00d084;
    color:#001b10;
}

#resetButton{
    background:#334155;
    color:white;
}

button:disabled{
    opacity:.5;
}

#space{
    height:430px;
    margin:20px auto;
    max-width:700px;
    position:relative;
    overflow:hidden;
    border:2px solid #334155;
    border-radius:15px;
    background:#030712;
}

#rocket{
    position:absolute;
    left:50%;
    bottom:25px;
    font-size:60px;
    transform:translateX(-50%);
}

.fly{
    animation:launch 8s linear forwards;
}

@keyframes launch{

    0%{
        bottom:25px;
    }

    25%{
        bottom:120px;
    }

    50%{
        bottom:220px;
    }

    75%{
        bottom:320px;
    }

    100%{
        bottom:380px;
    }

}

.telemetry{
    max-width:700px;
    margin:15px auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.card{
    background:#081226;
    border:1px solid #263858;
    border-radius:12px;
    padding:15px;
}

.label{
    color:#94a3b8;
    font-size:13px;
}

.value{
    display:block;
    margin-top:7px;
    font-size:22px;
    font-weight:bold;
    color:#38bdf8;
}

.bar{
    height:8px;
    margin-top:10px;
    background:#1e293b;
    border-radius:10px;
    overflow:hidden;
}

.barFill{
    height:100%;
    width:100%;
    background:#00d084;
}

.panel{
    max-width:700px;
    margin:15px auto;
    padding:15px;
    background:#081226;
    border:1px solid #263858;
    border-radius:12px;
}

#missionLog{
    height:160px;
    overflow-y:auto;
    background:#020617;
    border-radius:8px;
    padding:10px;
    text-align:left;
    font-family:monospace;
    font-size:13px;
}

.log{
    margin-bottom:7px;
    color:#9fffd3;
}

#success{
    display:none;
    max-width:700px;
    margin:15px auto;
    padding:18px;
    border:2px solid #00d084;
    border-radius:12px;
    background:#06351f;
}

#success h2{
    color:#00ff99;
}

@media(max-width:500px){

    .telemetry{
        grid-template-columns:1fr 1fr;
    }

}

</style>

</head>


<body>


<h1>
🚀 2060 MISSION CONTROL
</h1>


<div id="status">
SYSTEM READY
</div>


<div id="countdown"></div>


<button id="launchButton">
🚀 LAUNCH
</button>


<button id="resetButton">
↻ RESET
</button>


<div id="space">

<div id="rocket">
🚀
</div>

</div>


<div class="telemetry">


<div class="card">

<div class="label">
ALTITUDE
</div>

<span id="altitude"
class="value">
0 km
</span>

</div>


<div class="card">

<div class="label">
SPEED
</div>

<span id="speed"
class="value">
0 km/h
</span>

</div>


<div class="card">

<div class="label">
FUEL
</div>

<span id="fuel"
class="value">
100 %
</span>

<div class="bar">

<div id="fuelBar"
class="barFill">
</div>

</div>

</div>


<div class="card">

<div class="label">
SIGNAL
</div>

<span id="signal"
class="value">
100 %
</span>

</div>

</div>


<div id="success">

<h2>
🛰️ ORBIT ACHIEVED
</h2>

MISSION SUCCESS

</div>


<div class="panel">

<h2>
📝 MISSION LOG
</h2>

<div id="missionLog">

<div class="log">
SYSTEM INITIALIZED
</div>

<div class="log">
VEHICLE READY
</div>

</div>

</div>


<script>


const launchButton =
document.getElementById("launchButton");

const resetButton =
document.getElementById("resetButton");

const countdown =
document.getElementById("countdown");

const status =
document.getElementById("status");

const rocket =
document.getElementById("rocket");

const altitude =
document.getElementById("altitude");

const speed =
document.getElementById("speed");

const fuel =
document.getElementById("fuel");

const signal =
document.getElementById("signal");

const fuelBar =
document.getElementById("fuelBar");

const missionLog =
document.getElementById("missionLog");

const success =
document.getElementById("success");


let running = false;

let time = 0;

let timer = null;


function log(message){

let item =
document.createElement("div");

item.className =
"log";

item.innerText =
message;

missionLog.appendChild(item);

missionLog.scrollTop =
missionLog.scrollHeight;

}


function reset(){

clearInterval(timer);

running = false;

time = 0;

countdown.innerText = "";

status.innerText =
"SYSTEM READY";

rocket.classList.remove("fly");

rocket.style.bottom =
"25px";

altitude.innerText =
"0 km";

speed.innerText =
"0 km/h";

fuel.innerText =
"100 %";

signal.innerText =
"100 %";

fuelBar.style.width =
"100%";

success.style.display =
"none";

launchButton.disabled =
false;

missionLog.innerHTML =
"<div class='log'>SYSTEM INITIALIZED</div>" +
"<div class='log'>VEHICLE READY</div>";

}


function launch(){

if(running){
return;
}

running = true;

launchButton.disabled =
true;

status.innerText =
"COUNTDOWN STARTED";

log(
"LAUNCH SEQUENCE STARTED"
);


let number = 3;

countdown.innerText =
number;


let countdownTimer =
setInterval(function(){

number--;

if(number > 0){

countdown.innerText =
number;

log(
"T-" + number
);

return;

}


clearInterval(countdownTimer);

countdown.innerText =
"🚀";

status.innerText =
"LIFTOFF!";

log(
"ENGINE IGNITION"
);

log(
"LIFTOFF CONFIRMED"
);

rocket.classList.remove("fly");

void rocket.offsetWidth;

rocket.classList.add("fly");

log(
"ASCENT STARTED"
);


timer =
setInterval(function(){

time++;


/* ALTITUDE */

let currentAltitude =
time * 100;

altitude.innerText =
currentAltitude +
" km";


/* SPEED */

let currentSpeed =
time * 5000;

speed.innerText =
currentSpeed.toLocaleString() +
" km/h";


/* FUEL */

let currentFuel =
Math.max(
0,
100 - time * 5
);

fuel.innerText =
currentFuel +
" %";

fuelBar.style.width =
currentFuel +
"%";


/* SIGNAL */

let currentSignal =
Math.max(
70,
100 - time * 2
);

signal.innerText =
currentSignal +
" %";


/* MISSION EVENTS */

if(time === 3){

status.innerText =
"ASCENT NOMINAL";

log(
"ASCENT NOMINAL"
);

}


if(time === 5){

status.innerText =
"ORBIT INSERTION";

log(
"ORBIT INSERTION BURN"
);

}


if(time === 8){

clearInterval(timer);

status.innerText =
"ORBIT ACHIEVED";

countdown.innerText =
"🛰️";

success.style.display =
"block";

log(
"ORBIT ACHIEVED"
);

log(
"MISSION SUCCESS"
);

running = false;

}

},1000);

}


launchButton.onclick =
launch;

resetButton.onclick =
reset;


</script>


</body>

</html>
