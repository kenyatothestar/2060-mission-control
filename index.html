<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2060 Mission Control</title>

<style>
body{
    margin:0;
    background:#020617;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:40px 15px;
}

button{
    background:#00d084;
    border:0;
    padding:18px 35px;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
}

#rocket{
    font-size:60px;
    margin-top:150px;
}

.fly{
    animation:launch 5s linear forwards;
}

@keyframes launch{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-400px);
    }
}
</style>
</head>

<body>

<h1>🚀 2060 MISSION CONTROL</h1>

<p id="status">SYSTEM READY</p>

<button onclick="launch()">🚀 LAUNCH</button>

<div id="rocket">🚀</div>

<script>

function launch(){

document.getElementById("status").innerText =
"🚀 LIFTOFF!";

document.getElementById("rocket")
.classList.add("fly");

}

</script>

</body>
</html>
