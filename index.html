<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2060 Mission Control V2.3.3</title>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:Arial,sans-serif;
text-align:center;
}

header{
padding:20px;
background:#081226;
border-bottom:1px solid #263858;
}

header h1{
margin:0;
font-size:24px;
}

header p{
color:#94a3b8;
}

#status{
margin:15px;
font-size:21px;
font-weight:bold;
color:#00ff99;
}

#countdown{
font-size:70px;
font-weight:bold;
color:#00ff99;
height:90px;
}

#space{
height:500px;
margin:20px;
border:2px solid #334155;
border-radius:15px;
position:relative;
overflow:hidden;
background:#030712;
}

#rocket{
position:absolute;
left:50%;
bottom:30px;
transform:translateX(-50%);
font-size:60px;
z-index:10;
}

#rocket.fly{
animation:fly 5s linear forwards;
}

@keyframes fly{

from{
bottom:30px;
}

to{
bottom:430px;
}

}

.controls{
display:flex;
gap:10px;
margin:20px;
}

button{
flex:1;
padding:15px;
font-size:17px;
font-weight:bold;
border:0;
border-radius:10px;
}

#launch{
background:#00d084;
color:#001b10;
}

#reset{
background:#334155;
color:white;
}

button:disabled{
opacity:.4;
}

.telemetry{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin:20px;
}

.card{
background:#081226;
border:1px solid #263858;
border-radius:12px;
padding:15px;
}

.card small{
color:#94a3b8;
}

.card strong{
display:block;
font-size:22px;
margin-top:8px;
}

.progress{
height:8px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.bar{
height:100%;
width:100%;
background:#00d084;
transition:width .5s;
}

.panel{
margin:20px;
padding:15px;
background:#081226;
border:1px solid #263858;
border-radius:12px;
text-align:left;
}

#alert{
padding:15px;
background:#020617;
border-left:5px solid #00d084;
color:#9fffd3;
}

#log{
height:180px;
overflow:auto;
background:#020617;
padding:12px;
border-radius:8px;
font-family:monospace;
font-size:13px;
}

.logline{
margin-bottom:7px;
color:#9fffd3;
}

@media(max-width:700px){

.telemetry{
grid-template-columns:repeat(2,1fr);
}

.controls{
flex-direction:column;
}

}

</style>
</head>

</div>
