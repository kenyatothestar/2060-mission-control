<title>2060 Mission Control V2.4</title>

<style>

body{
    margin:0;
    background:#020617;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

header{
    padding:20px;
    background:#081226;
    border-bottom:1px solid #263858;
}

header h1{
    margin:0;
    font-size:24px;
}

header p{
    color:#94a3b8;
}

#status{
    margin:15px;
    font-size:21px;
    font-weight:bold;
    color:#00ff99;
}

#countdown{
    font-size:70px;
    font-weight:bold;
    color:#00ff99;
    height:90px;
}

/* SPACE */

#space{
    height:500px;
    margin:20px;
    border:2px solid #334155;
    border-radius:15px;
    position:relative;
    overflow:hidden;
    background:#030712;
}

#rocket{
    position:absolute;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    font-size:60px;
    z-index:10;
}

#rocket.fly{
    animation:fly 5s linear forwards;
}

@keyframes fly{

    from{
        bottom:30px;
    }

    to{
        bottom:430px;
    }

}


/* CONTROLS */

.controls{
    display:flex;
    gap:10px;
    margin:20px;
}

button{
    flex:1;
    padding:15px;
    font-size:17px;
    font-weight:bold;
    border:0;
    border-radius:10px;
    cursor:pointer;
}

#launch{
    background:#00d084;
    color:#001b10;
}

#reset{
    background:#334155;
    color:white;
}
