<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2060 Mission Control V2.2.1</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#020617;
color:white;
font-family:Arial,sans-serif;
}

header{
background:#081226;
padding:20px;
text-align:center;
border-bottom:1px solid #263858;
}

header h1{
margin:0;
font-size:24px;
}

header p{
color:#94a3b8;
margin:8px 0 0;
}

.container{
max-width:1100px;
margin:auto;
padding:15px;
}

.status{
background:#081226;
border:1px solid #263858;
border-radius:12px;
padding:15px;
text-align:center;
margin-bottom:15px;
}

#status{
color:#00ff99;
font-weight:bold;
}

/* SPACE */

#space{
height:450px;
position:relative;
overflow:hidden;
background:#01040b;
border:1px solid #263858;
border-radius:15px;
margin-bottom:15px;
}

.stars{
position:absolute;
inset:0;

background-image:
radial-gradient(#ffffff 1px,transparent 1px),
radial-gradient(#ffffff 1px,transparent 1px);

background-size:80px 80px,130px 130px;

opacity:.45;
}

.earth{
position:absolute;

width:240px;
height:240px;

border-radius:50%;

left:50%;
bottom:-130px;

transform:translateX(-50%);

background:
radial-gradient(
circle at 35% 30%,
#60a5fa,
#2563eb 50%,
#061631 75%
);

box-shadow:0 0 80px #1264d8;
}

.orbit{
position:absolute;

width:350px;
height:180px;

left:50%;
top:100px;

transform:translateX(-50%);

border:2px dashed #48658f;

border-radius:50%;
}

/* ROCKET */

#rocket{
position:absolute;

left:50%;
bottom:30px;

transform:translateX(-50%);

font-size:58px;

z-index:10;
}

#rocket.fly{
animation:rocketFlight 8s linear forwards;
}

@keyframes rocketFlight{

0%{
bottom:30px;
transform:translateX(-50%) rotate(0deg);
}

20%{
bottom:90px;
transform:translateX(-50%) rotate(0deg);
}

40%{
bottom:170px;
transform:translateX(-50%) rotate(0deg);
}

60%{
bottom:250px;
transform:translateX(-50%) rotate(0deg);
}

80%{
bottom:330px;
transform:translateX(-50%) rotate(0deg);
}

100%{
bottom:390px;
transform:translateX(-50%) rotate(0deg);
}

}

#flame{
display:none;
font-size:28px;
text-align:center;
}

#countdown{
display:none;

position:absolute;

top:120px;

left:0;
right:0;

text-align:center;

font-size:90px;

font-weight:bold;

color:#00ff99;

z-index:20;
}

/* BUTTONS */

.controls{
display:flex;
gap:10px;
margin-bottom:15px;
}

button{
flex:1;

padding:15px;

border:0;

border-radius:10px;

font-size:16px;

font-weight:bold;
}

#launch{
background:#00d084;
color:#001b10;
}

#abort{
background:#ef4444;
color:white;
}

#reset{
background:#334155;
color:white;
}

button:disabled{
opacity:.4;
}

/* TELEMETRY */

.grid{
display:grid;

grid-template-columns:
repeat(4,1fr);

gap:10px;

margin-bottom:15px;
}

.card{
background:#081226;

border:1px solid #263858;

border-radius:12px;

padding:15px;
}

.card small{
color:#94a3b8;
}

.card strong{
display:block;

font-size:21px;

margin-top:8px;
}

.progress{
height:8px;

background:#1e293b;

border-radius:10px;

overflow:hidden;

margin-top:10px;
}

.bar{
height:100%;

width:100%;

background:#00d084;

transition:width .5s;
}

/* PANELS */

.panel{
background:#081226;

border:1px solid #263858;

border-radius:12px;

padding:15px;

margin-bottom:15px;
}

.panel h3{
margin-top:0;
}

.log{
height:170px;

overflow:auto;

background:#020617;

border-radius:8px;

padding:10px;

font-family:monospace;

font-size:12px;
}

.logline{
margin-bottom:7px;

color:#9fffd3;
}

.alert{
color:#9fffd3;

font-family:monospace;
}

/* MISSION PHASE */

.phases{
display:flex;

gap:5px;
}

.phase{
flex:1;

padding:10px 4px;

background:#17243b;

border-radius:7px;

text-align:center;

font-size:11px;

color:#94a3b8;
}

.phase.active{
background:#00a66a;

color:white;
}

.phase.done{
background:#245d4a;

color:#baffdf;
}

/* MOBILE */

@media(max-width:700px){

.grid{
grid-template-columns:
repeat(2,1fr);
}

.controls{
flex-direction:column;
}

#space{
height:450px;
}

.phases{
flex-wrap:wrap;
}

.phase{
min-width:30%;
}

}

</style>

</head>

<body>

<header>

<h1>🚀 2060 MISSION CONTROL</h1>

<p>Aerospace Operations Dashboard • V2.2.1</p>

</header>


<div class="container">


<div class="status">

MISSION STATUS:

<span id="status">
STANDBY
</span>

</div>


<div id="space">

<div class="stars"></div>

<div id="countdown">
3
</div>

<div class="orbit"></div>

<div id="rocket">

🚀

<div id="flame">
🔥
</div>

</div>

<div class="earth"></div>

</div>


<div class="controls">

<button id="launch">
🚀 LAUNCH
</button>

<button id="abort" disabled>
⛔ ABORT
</button>

<button id="reset">
↻ RESET
</button>

</div>


<div class="grid">


<div class="card">

<small>
ALTITUDE
</small>

<strong>
<span id="altitude">0</span> km
</strong>

</div>


<div class="card">

<small>
SPEED
</small>

<strong>
<span id="speed">0</span> km/h
</strong>

</div>


<div class="card">

<small>
FUEL
</small>

<strong>
<span id="fuel">100</span>%
</strong>

<div class="progress">

<div
id="fuelBar"
class="bar">
</div>

</div>

</div>


<div class="card">

<small>
SIGNAL
</small>

<strong>
<span id="signal">100</span>%
</strong>

<div class="progress">

<div
id="signalBar"
class="bar">
</div>

</div>

</div>


</div>


<div class="panel">

<h3>
🎯 MISSION PHASE
</h3>

<div class="phases">

<div id="p1" class="phase active">
STANDBY
</div>

<div id="p2" class="phase">
COUNTDOWN
</div>

<div id="p3" class="phase">
LIFTOFF
</div>

<div id="p4" class="phase">
ASCENT
</div>

<div id="p5" class="phase">
ORBIT
</div>

</div>

</div>


<div class="panel">

<h3>
📡 SYSTEM STATUS
</h3>

<div id="alert" class="alert">

SYSTEM READY — ALL SYSTEMS NOMINAL

</div>

</div>


<div class="panel">

<h3>
📝 MISSION LOG
</h3>

<div id="log" class="log">
</div>

</div>


</div>


<script>

/* ELEMENTS */

const launchBtn =
document.getElementById("launch");

const abortBtn =
document.getElementById("abort");

const resetBtn =
document.getElementById("reset");

const rocket =
document.getElementById("rocket");

const flame =
document.getElementById("flame");

const countdown =
document.getElementById("countdown");

const statusEl =
document.getElementById("status");

const altitudeEl =
document.getElementById("altitude");

const speedEl =
document.getElementById("speed");

const fuelEl =
document.getElementById("fuel");

const signalEl =
document.getElementById("signal");

const fuelBar =
document.getElementById("fuelBar");

const signalBar =
document.getElementById("signalBar");

const alertEl =
document.getElementById("alert");

const logEl =
document.getElementById("log");


/* VARIABLES */

let countdownTimer;

let telemetryTimer;

let seconds = 0;

let altitude = 0;

let speed = 0;

let fuel = 100;

let signal = 100;

let running = false;


/* LOG */

function addLog(message){

const line =
document.createElement("div");

line.className =
"logline";

line.textContent =
"[" +
new Date().toLocaleTimeString() +
"] " +
message;

logEl.appendChild(line);

logEl.scrollTop =
logEl.scrollHeight;

}


/* PHASE */

function setPhase(number){

const phases = [
"p1",
"p2",
"p3",
"p4",
"p5"
];

phases.forEach(
function(id,index){

const element =
document.getElementById(id);

element.classList.remove("active");

element.classList.remove("done");

if(index < number){

element.classList.add("done");

}

}
);

document
.getElementById(phases[number])
.classList.add("active");

}


/* UPDATE TELEMETRY */

function updateTelemetry(){

altitudeEl.textContent =
Math.floor(altitude);

speedEl.textContent =
Math.floor(speed);

fuelEl.textContent =
Math.max(0,fuel).toFixed(1);

signalEl.textContent =
Math.max(0,signal).toFixed(0);

fuelBar.style.width =
Math.max(0,fuel) + "%";

signalBar.style.width =
Math.max(0,signal) + "%";

}


/* LAUNCH */

function launch(){

if(running){
return;
}

running = true;

launchBtn.disabled = true;

abortBtn.disabled = false;

statusEl.textContent =
"COUNTDOWN";

statusEl.style.color =
"#ffd166";

setPhase(1);

addLog(
"LAUNCH SEQUENCE STARTED"
);

addLog(
"Flight computer online"
);

countdown.style.display =
"block";

let number = 3;

countdown.textContent =
number;


/* COUNTDOWN */

countdownTimer =
setInterval(function(){

number--;

if(number > 0){

countdown.textContent =
number;

addLog(
"T-" + number
);

}

else{

clearInterval(
countdownTimer
);

countdown.style.display =
"none";

liftoff();

}

},1000);

}


/* LIFTOFF */

function liftoff(){

statusEl.textContent =
"LIFTOFF";

statusEl.style.color =
"#00ff99";

setPhase(2);

flame.style.display =
"block";

addLog(
"ENGINE IGNITION"
);

addLog(
"THRUST NOMINAL"
);

addLog(
"🚀 LIFTOFF CONFIRMED"
);


/*
IMPORTANT:
Restart the CSS animation
*/

rocket.classList.remove("fly");

void rocket.offsetWidth;

rocket.classList.add("fly");


/* TELEMETRY */

telemetryTimer =
setInterval(function(){

seconds++;

altitude +=
100 + seconds * 10;

speed +=
6000;

fuel -=
1.5;

signal =
Math.max(
70,
100 - seconds * .7
);

updateTelemetry();


if(seconds === 4){

statusEl.textContent =
"ASCENT";

setPhase(3);

addLog(
"ASCENT PHASE"
);

alertEl.textContent =
"ASCENT NOMINAL — VEHICLE STABLE";

}


if(seconds === 8){

addLog(
"UPPER ATMOSPHERE REACHED"
);

alertEl.textContent =
"UPPER ATMOSPHERE — TELEMETRY NOMINAL";

}


if(seconds === 12){

statusEl.textContent =
"ORBIT INSERTION";

addLog(
"PREPARING ORBIT INSERTION"
);

}


if(seconds >= 16){

enterOrbit();

}

},1000);

}


/* ORBIT */

function enterOrbit(){

clearInterval(
telemetryTimer
);

running = false;

statusEl.textContent =
"ORBIT";

statusEl.style.color =
"#00ff99";

setPhase(4);

flame.style.display =
"none";

addLog(
"ORBITAL INSERTION SUCCESSFUL"
);

addLog(
"🛰 SPACECRAFT IN ORBIT"
);

addLog(
"MISSION OBJECTIVE ACHIEVED"
);

alertEl.textContent =
"🛰 ORBIT ACHIEVED — SYSTEMS NOMINAL";

abortBtn.disabled = true;

}


/* ABORT */

function abortMission(){

clearInterval(
countdownTimer
);

clearInterval(
telemetryTimer
);

running = false;

countdown.style.display =
"none";

flame.style.display =
"none";

rocket.classList.remove("fly");

statusEl.textContent =
"ABORTED";

statusEl.style.color =
"#ff4444";

alertEl.textContent =
"⚠ EMERGENCY ABORT";

launchBtn.disabled = true;

abortBtn.disabled = true;

addLog(
"⚠ MISSION ABORTED"
);

}


/* RESET */

function resetMission(){

clearInterval(
countdownTimer
);

clearInterval(
telemetryTimer
);

running = false;

seconds = 0;

altitude = 0;

speed = 0;

fuel = 100;

signal = 100;


/*
Remove animation
*/

rocket.classList.remove("fly");

flame.style.display =
"none";

countdown.style.display =
"none";

statusEl.textContent =
"STANDBY";

statusEl.style.color =
"#00ff99";

alertEl.textContent =
"SYSTEM READY — ALL SYSTEMS NOMINAL";

launchBtn.disabled = false;

abortBtn.disabled = true;

setPhase(0);

logEl.innerHTML = "";

addLog(
"MISSION CONTROL INITIALIZED"
);

addLog(
"VEHICLE READY"
);

addLog(
"ALL SYSTEMS NOMINAL"
);

updateTelemetry();

}


/* BUTTONS */

launchBtn.onclick =
launch;

abortBtn.onclick =
abortMission;

resetBtn.onclick =
resetMission;


/* START */

resetMission();

</script>

</body>
    </html>
