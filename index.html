<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>2060 Mission Control V2.4</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#020617;
color:white;
font-family:Arial,sans-serif;
text-align:center;
}

header{
padding:20px;
background:#081226;
border-bottom:1px solid #263858;
}

header h1{
margin:0;
font-size:24px;
}

header p{
margin:8px 0 0;
color:#94a3b8;
}

#status{
margin:15px;
font-size:21px;
font-weight:bold;
color:#00ff99;
}

#countdown{
height:90px;
font-size:70px;
font-weight:bold;
color:#00ff99;
}

/* SPACE */

#space{
height:500px;
margin:20px;
position:relative;
overflow:hidden;
background:#030712;
border:2px solid #334155;
border-radius:15px;
}

.stars{
position:absolute;
inset:0;

background-image:
radial-gradient(#fff 1px,transparent 1px),
radial-gradient(#fff 1px,transparent 1px);

background-size:
80px 80px,
130px 130px;

opacity:.35;
}

.earth{
position:absolute;
width:220px;
height:220px;
left:50%;
bottom:-120px;
transform:translateX(-50%);
border-radius:50%;

background:
radial-gradient(
circle at 35% 30%,
#60a5fa,
#2563eb 50%,
#061631 75%
);

box-shadow:
0 0 70px #1264d8;
}

.orbit{
position:absolute;
width:330px;
height:170px;
left:50%;
top:90px;
transform:translateX(-50%);
border:2px dashed #48658f;
border-radius:50%;
}

/* ROCKET */

#rocket{
position:absolute;
left:50%;
bottom:30px;
transform:translateX(-50%);
font-size:60px;
z-index:10;
}

#rocket.fly{
animation:fly 5s linear forwards;
}

@keyframes fly{

from{
bottom:30px;
}

to{
bottom:430px;
}

}

/* CONTROLS */

.controls{
display:flex;
gap:10px;
margin:20px;
}

button{
flex:1;
padding:15px;
font-size:17px;
font-weight:bold;
border:0;
border-radius:10px;
cursor:pointer;
}

#launch{
background:#00d084;
color:#001b10;
}

#abort{
background:#ef4444;
color:white;
}

#reset{
background:#334155;
color:white;
}

button:disabled{
opacity:.4;
cursor:not-allowed;
}

/* TELEMETRY */

.telemetry{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin:20px;
}

.card{
background:#081226;
border:1px solid #263858;
border-radius:12px;
padding:15px;
}

.card small{
color:#94a3b8;
}

.card strong{
display:block;
font-size:22px;
margin-top:8px;
}

.progress{
height:8px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.bar{
height:100%;
width:100%;
background:#00d084;
transition:width .5s;
}

/* PANELS */

.panel{
margin:20px;
padding:15px;
background:#081226;
border:1px solid #263858;
border-radius:12px;
text-align:left;
}

.panel h3{
margin-top:0;
}

/* ALERT */

#alert{
padding:15px;
background:#020617;
border-left:5px solid #00d084;
border-radius:8px;
color:#9fffd3;
}

#alertTitle{
font-weight:bold;
color:#00ff99;
}

#alertMessage{
margin-top:5px;
}

/* SYSTEM HEALTH */

.systems{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

.system{
background:#020617;
border:1px solid #263858;
border-radius:10px;
padding:15px;
}

.systemName{
color:#94a3b8;
font-size:12px;
}

.systemStatus{
display:block;
margin-top:8px;
font-weight:bold;
color:#00ff99;
}

/* MISSION PHASE */

.phases{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:7px;
}

.phase{
padding:10px 5px;
background:#17243b;
border-radius:7px;
text-align:center;
font-size:11px;
color:#94a3b8;
}

.phase.active{
background:#00a66a;
color:white;
}

.phase.done{
background:#245d4a;
color:#baffdf;
}

/* EVENT TIMELINE */

.timeline{
max-height:260px;
overflow:auto;
}

.event{
background:#020617;
border-left:3px solid #00d084;
border-radius:5px;
padding:10px;
margin-bottom:10px;
}

.eventTime{
font-size:11px;
color:#64748b;
}

.eventTitle{
font-weight:bold;
margin-top:
