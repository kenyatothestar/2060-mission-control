<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2060 Mission Control</title>

<style>
body{
margin:0;
background:#020611;
color:white;
font-family:Arial,sans-serif;
text-align:center;
}

header{
padding:20px;
background:#091329;
}

h1{
margin:0;
font-size:24px;
}

#status{
margin:15px;
color:#00ff99;
font-weight:bold;
}

#space{
height:450px;
margin:15px;
border-radius:15px;
position:relative;
overflow:hidden;
background:#02040b;
border:1px solid #263657;
}

.rocket{
position:absolute;
left:50%;
bottom:70px;
font-size:55px;
transform:translateX(-50%);
transition:bottom 1s linear;
z-index:5;
}

.flame{
display:none;
font-size:30px;
}

#countdown{
position:absolute;
top:150px;
left:0;
right:0;
font-size:90px;
color:#00ff99;
z-index:10;
}

button{
padding:15px 25px;
margin:5px;
border:0;
border-radius:10px;
font-weight:bold;
font-size:16px;
}

#launch{
background:#00d084;
}

#abort{
background:#ef4444;
color:white;
}

#reset{
background:#33415f;
color:white;
}

button:disabled{
opacity:.4;
}

.data{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin:15px;
}

.card{
background:#091329;
padding:15px;
border-radius:10px;
border:1px solid #263657;
}

.card strong{
display:block;
font-size:22px;
margin-top:5px;
}

#log{
margin:15px;
padding:15px;
height:130px;
overflow:auto;
background:#091329;
border-radius:10px;
text-align:left;
font-family:monospace;
font-size:13px;
}
</style>
</head>

<body>

<header>
<h1>🚀 2060 MISSION CONTROL</h1>
<p>V1.9 Launch Simulation</p>
</header>

<div id="status">
MISSION STATUS: STANDBY
</div>

<div id="space">

<div id="countdown"></div>

<div id="rocket" class="rocket">
🚀
<div id="flame" class="flame">🔥</div>
</div>

</div>

<div>

<button id="launch">🚀 LAUNCH</button>

<button id="abort" disabled>
⛔ ABORT
</button>

<button id="reset">
↻ RESET
</button>

</div>

<div class="data">

<div class="card">
ALTITUDE
<strong><span id="altitude">0</span> km</strong>
</div>

<div class="card">
SPEED
<strong><span id="speed">0</span> km/h</strong>
</div>

<div class="card">
FUEL
<strong><span id="fuel">100</span>%</strong>
</div>

<div class="card">
TIME
<strong><span id="time">00:00</span></strong>
</div>

</div>

<h3>MISSION LOG</h3>

<div id="log"></div>

<script>

const launch=document.getElementById("launch");
const abort=document.getElementById("abort");
const reset=document.getElementById("reset");

const rocket=document.getElementById("rocket");
const flame=document.getElementById("flame");
const countdown=document.getElementById("countdown");

const status=document.getElementById("status");
const altitude=document.getElementById("altitude");
const speed=document.getElementById("speed");
const fuel=document.getElementById("fuel");
const time=document.getElementById("time");
const log=document.getElementById("log");

let timer;
let countdownTimer;

let seconds=0;
let alt=0;
let spd=0;
let fuelLevel=100;

let running=false;

function addLog(text){

let line=document.createElement("div");

line.textContent=
"["+
new Date().toLocaleTimeString()+
"] "+
text;

log.appendChild(line);

log.scrollTop=log.scrollHeight;

}

function start(){

if(running)return;

running=true;

launch.disabled=true;
abort.disabled=false;

status.textContent="MISSION STATUS: COUNTDOWN";

addLog("Launch sequence started.");

let n=3;

countdown.textContent=n;

countdownTimer=setInterval(function(){

n--;

if(n>0){

countdown.textContent=n;

addLog("T-"+n);

}else{

clearInterval(countdownTimer);

countdown.textContent="";

liftoff();

}

},1000);

}

function liftoff(){

status.textContent="MISSION STATUS: LIFTOFF";

flame.style.display="block";

addLog("ENGINE IGNITION.");

addLog("🚀 LIFTOFF!");

let height=70;

timer=setInterval(function(){

seconds++;

alt+=100;

spd+=5000;

fuelLevel-=1;

height+=25;

rocket.style.bottom=height+"px";

altitude.textContent=Math.floor(alt);

speed.textContent=Math.floor(spd);

fuel.textContent=Math.max(0,fuelLevel);

let m=Math.floor(seconds/60);

let s=seconds%60;

time.textContent=
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");

if(seconds===3){

status.textContent="MISSION STATUS: ASCENT";

addLog("ASCENT PHASE.");

}

if(seconds===8){

status.textContent="MISSION STATUS: UPPER ASCENT";

addLog("Vehicle climbing toward orbit.");

}

if(seconds===15){

clearInterval(timer);

flame.style.display="none";

status.textContent="MISSION STATUS: ORBIT";

addLog("🛰 ORBIT ACHIEVED.");

abort.disabled=true;

running=false;

}

},1000);

}

function stop(){

clearInterval(timer);

clearInterval(countdownTimer);

running=false;

flame.style.display="none";

countdown.textContent="";

status.textContent="MISSION STATUS: ABORTED";

addLog("⚠ MISSION ABORTED.");

abort.disabled=true;

}

function resetMission(){

clearInterval(timer);

clearInterval(countdownTimer);

running=false;

seconds=0;
alt=0;
spd=0;
fuelLevel=100;

rocket.style.bottom="70px";

flame.style.display="none";

countdown.textContent="";

status.textContent="MISSION STATUS: STANDBY";

altitude.textContent="0";
speed.textContent="0";
fuel.textContent="100";
time.textContent="00:00";

launch.disabled=false;
abort.disabled=true;

log.innerHTML="";

addLog("Mission Control ready.");

}

launch.addEventListener("click",start);

abort.addEventListener("click",stop);

reset.addEventListener("click",resetMission);

resetMission();

</script>

</body>
</html>
