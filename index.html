<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2060 Mission Control V2.0</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#02050d;
color:#fff;
font-family:Arial,sans-serif;
}

header{
background:#081226;
padding:18px;
text-align:center;
border-bottom:1px solid #263858;
}

header h1{
margin:0;
font-size:24px;
letter-spacing:2px;
}

header p{
margin:7px 0 0;
color:#8da0c2;
font-size:13px;
}

.container{
max-width:1100px;
margin:auto;
padding:14px;
}

.status{
background:#081226;
border:1px solid #263858;
border-radius:12px;
padding:15px;
text-align:center;
margin-bottom:14px;
}

#status{
color:#00ff99;
font-weight:bold;
}

.mission-map{
height:440px;
background:#01040b;
border:1px solid #263858;
border-radius:15px;
position:relative;
overflow:hidden;
margin-bottom:14px;
}

.stars{
position:absolute;
inset:0;
background-image:
radial-gradient(#fff 1px,transparent 1px),
radial-gradient(#fff 1px,transparent 1px);
background-size:80px 80px,130px 130px;
opacity:.45;
}

.earth{
position:absolute;
width:250px;
height:250px;
border-radius:50%;
left:50%;
bottom:-130px;
transform:translateX(-50%);
background:
radial-gradient(circle at 35% 30%,#62b6ff,#1d5eb6 50%,#061631 75%);
box-shadow:0 0 80px #1264d8;
}

.orbit{
position:absolute;
width:360px;
height:190px;
left:50%;
top:100px;
transform:translateX(-50%);
border:2px dashed #48658f;
border-radius:50%;
}

.rocket{
position:absolute;
left:50%;
bottom:75px;
transform:translateX(-50%);
font-size:55px;
z-index:5;
transition:all .8s linear;
}

.flame{
display:none;
font-size:30px;
text-align:center;
}

#countdown{
display:none;
position:absolute;
z-index:20;
top:120px;
left:0;
right:0;
font-size:90px;
font-weight:bold;
color:#00ff99;
text-shadow:0 0 30px #00ff99;
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:14px;
}

button{
flex:1;
min-width:120px;
padding:14px;
border:0;
border-radius:10px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

#launch{
background:#00d084;
color:#001b10;
}

#abort{
background:#ef4444;
color:white;
}

#reset{
background:#344563;
color:white;
}

button:disabled{
opacity:.4;
cursor:not-allowed;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:14px;
}

.card{
background:#081226;
border:1px solid #263858;
border-radius:12px;
padding:15px;
}

.card small{
color:#8da0c2;
}

.card strong{
display:block;
font-size:21px;
margin-top:7px;
}

.progress{
height:9px;
background:#1a2944;
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.bar{
height:100%;
width:100%;
background:#00d084;
transition:width .5s;
}

.panel{
background:#081226;
border:1px solid #263858;
border-radius:12px;
padding:15px;
margin-bottom:14px;
}

canvas{
width:100%;
height:190px;
background:#02050d;
border-radius:8px;
}

.phases{
display:flex;
gap:6px;
margin-top:12px;
}

.phase{
flex:1;
padding:10px 4px;
text-align:center;
font-size:11px;
border-radius:7px;
background:#17243b;
color:#7f91b1;
}

.phase.active{
background:#00a66a;
color:#fff;
}

.phase.done{
background:#245d4a;
color:#baffdf;
}

.alert{
font-family:monospace;
color:#9fffd3;
}

#log{
height:170px;
overflow:auto;
background:#02050d;
border-radius:8px;
padding:10px;
font-family:monospace;
font-size:12px;
}

.logline{
margin-bottom:7px;
color:#9fffd3;
}

@media(max-width:700px){

.grid{
grid-template-columns:repeat(2,1fr);
}

.mission-map{
height:400px;
}

.orbit{
width:310px;
}

}
</style>
</head>

<body>

<header>
<h1>🚀 2060 MISSION CONTROL</h1>
<p>Aerospace Operations Dashboard • V2.0</p>
</header>

<div class="container">

<div class="status">
MISSION STATUS:
<span id="status">STANDBY</span>
</div>

<div class="mission-map">

<div class="stars"></div>

<div id="countdown">3</div>

<div class="orbit"></div>

<div id="rocket" class="rocket">
🚀
<div id="flame" class="flame">🔥</div>
</div>

<div class="earth"></div>

</div>

<div class="controls">

<button id="launch">🚀 LAUNCH</button>

<button id="abort" disabled>⛔ ABORT</button>

<button id="reset">↻ RESET</button>

</div>

<div class="grid">

<div class="card">
<small>ALTITUDE</small>
<strong><span id="altitude">0</span> km</strong>
</div>

<div class="card">
<small>SPEED</small>
<strong><span id="speed">0</span> km/h</strong>
</div>

<div class="card">
<small>FUEL</small>
<strong><span id="fuel">100</span>%</strong>

<div class="progress">
<div id="fuelbar" class="bar"></div>
</div>

</div>

<div class="card">
<small>SIGNAL</small>
<strong><span id="signal">100</span>%</strong>

<div class="progress">
<div id="signalbar" class="bar"></div>
</div>

</div>

</div>

<div class="panel">

<h3>🎯 MISSION PHASE</h3>

<div class="phases">

<div id="p1" class="phase active">
STANDBY
</div>

<div id="p2" class="phase">
COUNTDOWN
</div>

<div id="p3" class="phase">
LIFTOFF
</div>

<div id="p4" class="phase">
ASCENT
</div>

<div id="p5" class="phase">
ORBIT
</div>

</div>

</div>

<div class="panel">

<h3>📈 LIVE TELEMETRY</h3>

<canvas id="graph" width="900" height="190"></canvas>

</div>

<div class="panel">

<h3>📡 SYSTEM ALERT</h3>

<div id="alert" class="alert">
SYSTEM READY — ALL SYSTEMS NOMINAL
</div>

</div>

<div class="panel">

<h3>📝 MISSION LOG</h3>

<div id="log"></div>

</div>

</div>

<script>

const launchBtn=document.getElementById("launch");
const abortBtn=document.getElementById("abort");
const resetBtn=document.getElementById("reset");

const statusEl=document.getElementById("status");
const countdown=document.getElementById("countdown");

const rocket=document.getElementById("rocket");
const flame=document.getElementById("flame");

const altitudeEl=document.getElementById("altitude");
const speedEl=document.getElementById("speed");
const fuelEl=document.getElementById("fuel");
const signalEl=document.getElementById("signal");

const fuelbar=document.getElementById("fuelbar");
const signalbar=document.getElementById("signalbar");

const alertEl=document.getElementById("alert");
const logEl=document.getElementById("log");

const canvas=document.getElementById("graph");
const ctx=canvas.getContext("2d");

let countdownTimer=null;
let telemetryTimer=null;
let orbitTimer=null;

let running=false;
let aborted=false;

let seconds=0;
let altitude=0;
let speed=0;
let fuel=100;
let signal=100;

let altitudeData=[];
let speedData=[];

function log(message){

const line=document.createElement("div");

line.className="logline";

line.textContent=
"["+new Date().toLocaleTimeString()+"] "+message;

logEl.appendChild(line);

logEl.scrollTop=logEl.scrollHeight;

}

function phase(active){

const phases=[
"p1",
"p2",
"p3",
"p4",
"p5"
];

phases.forEach((id,index)=>{

const el=document.getElementById(id);

el.classList.remove("active");

if(index<active){
el.classList.add("done");
}

});

if(active>=0){
document.getElementById(phases[active]).classList.add("active");
}

}

function update(){

altitudeEl.textContent=Math.floor(altitude);

speedEl.textContent=Math.floor(speed);

fuelEl.textContent=Math.max(0,fuel).toFixed(1);

signalEl.textContent=Math.max(0,signal).toFixed(0);

fuelbar.style.width=Math.max(0,fuel)+"%";

signalbar.style.width=Math.max(0,signal)+"%";

}

function drawGraph(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.strokeStyle="#243858";

for(let y=30;y<190;y+=40){

ctx.beginPath();

ctx.moveTo(0,y);

ctx.lineTo(900,y);

ctx.stroke();

}

ctx.strokeStyle="#00ff99";
ctx.lineWidth=3;

ctx.beginPath();

altitudeData.forEach((v,i)=>{

let x=i*30;

let y=175-(v/3000)*140;

if(y<20)y=20;

if(i===0)ctx.moveTo(x,y);
else ctx.lineTo(x,y);

});

ctx.stroke();

ctx.strokeStyle="#ffd166";
ctx.beginPath();

speedData.forEach((v,i)=>{

let x=i*30;

let y=175-(v/150000)*140;

if(y<20)y=20;

if(i===0)ctx.moveTo(x,y);
else ctx.lineTo(x,y);

});

ctx.stroke();

}

function launch(){

if(running)return;

running=true;
aborted=false;

launchBtn.disabled=true;
abortBtn.disabled=false;

statusEl.textContent="COUNTDOWN";
statusEl.style.color="#ffd166";

phase(1);

log("LAUNCH SEQUENCE INITIATED");
log("Flight computer online");
log("Guidance system nominal");

countdown.style.display="block";

let n=3;

countdown.textContent=n;

countdownTimer=setInterval(()=>{

n--;

if(n>0){

countdown.textContent=n;

log("T-"+n);

}else{

clearInterval(countdownTimer);

countdown.textContent="";

countdown.style.display="none";

liftoff();

}

},1000);

}

function liftoff(){

statusEl.textContent="LIFTOFF";

statusEl.style.color="#00ff99";

phase(2);

flame.style.display="block";

log("ENGINE IGNITION");
log("THRUST NOMINAL");
log("🚀 LIFTOFF CONFIRMED");

telemetryTimer=setInterval(updateMission,1000);

}

function updateMission(){

seconds++;

altitude+=120+(seconds*8);

speed+=6000;

fuel-=1.2;

signal=Math.max(70,100-(seconds*0.5));

altitudeData.push(altitude);
speedData.push(speed);

if(altitudeData.length>30){

altitudeData.shift();
speedData.shift();

}

update();
drawGraph();

let height=75+(seconds*20);

rocket.style.bottom=Math.min(340,height)+"px";

if(seconds===4){

statusEl.textContent="ASCENT";

phase(3);

log("ASCENT PHASE CONFIRMED");

}

if(seconds===8){

alertEl.textContent="HIGH ALTITUDE — TELEMETRY NOMINAL";

log("Upper atmosphere reached");

}

if(seconds===12){

statusEl.textContent="ORBIT INSERTION";

log("Preparing orbital insertion");

}

if(seconds>=16){

enterOrbit();

}

if(fuel<20){

alertEl.textContent="⚠ LOW FUEL WARNING";

}

}

function enterOrbit(){

clearInterval(telemetryTimer);

running=false;

flame.style.display="none";

statusEl.textContent="ORBIT";

statusEl.style.color="#00ff99";

phase(4);

log("ORBITAL INSERTION SUCCESSFUL");
log("🛰 SPACECRAFT ESTABLISHED IN ORBIT");
log("MISSION OBJECTIVE ACHIEVED");

alertEl.textContent=
"🛰 ORBIT ACHIEVED — TELEMETRY LINK NOMINAL";

abortBtn.disabled=true;

startOrbit();

}

function startOrbit(){

let angle=0;

orbitTimer=setInterval(()=>{

if(statusEl.textContent!=="ORBIT"){

clearInterval(orbitTimer);

return;

}

angle+=0.04;

let x=Math.cos(angle)*175;

let y=Math.sin(angle)*90;

rocket.style.left=
"calc(50% + "+x+"px)";

rocket.style.bottom=
(180+y)+"px";

rocket.style.transform=
"translateX(-50%) rotate("+
(angle*180/Math.PI+90)+
"deg)";

},30);

}

function abortMission(){

clearInterval(countdownTimer);
clearInterval(telemetryTimer);
clearInterval(orbitTimer);

running=false;

countdown.style.display="none";

flame.style.display="none";

statusEl.textContent="ABORTED";
statusEl.style.color="#ff4444";

alertEl.textContent=
"⚠ EMERGENCY ABORT EXECUTED";

launchBtn.disabled=true;
abortBtn.disabled=true;

log("⚠ EMERGENCY ABORT");
log("Mission terminated safely");

}

function resetMission(){

clearInterval(countdownTimer);
clearInterval(telemetryTimer);
clearInterval(orbitTimer);

running=false;
aborted=false;

seconds=0;
altitude=0;
speed=0;
fuel=100;
signal=100;

altitudeData=[];
speedData=[];

rocket.style.left="50%";
rocket.style.bottom="75px";
rocket.style.transform="translateX(-50%)";

flame.style.display="none";

countdown.style.display="none";

statusEl.textContent="STANDBY";
statusEl.style.color="#00ff99";

alertEl.textContent=
"SYSTEM READY — ALL SYSTEMS NOMINAL";

launchBtn.disabled=false;
abortBtn.disabled=true;

phase(0);

logEl.innerHTML="";

log("MISSION CONTROL INITIALIZED");
log("Vehicle ready");
log("All systems nominal");

update();
drawGraph();

}

launchBtn.addEventListener("click",launch);

abortBtn.addEventListener("click",abortMission);

resetBtn.addEventListener("click",resetMission);

resetMission();

</script>

</body>
  </html>
