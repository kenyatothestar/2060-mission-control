<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>2060 Mission Control V2.3.8</title>

<style>

body{
    margin:0;
    background:#020617;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:30px 15px;
}

h1{
    font-size:26px;
}

#status{
    font-size:20px;
    font-weight:bold;
    color:#00ff99;
    margin:15px;
}

#countdown{
    font-size:70px;
    font-weight:bold;
    color:#00ff99;
    height:100px;
}

button{
    background:#00d084;
    color:#001b10;
    border:0;
    padding:18px 35px;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
}

button:disabled{
    opacity:.5;
}

#space{
    height:500px;
    margin-top:20px;
    position:relative;
    overflow:hidden;
    border:2px solid #334155;
    border-radius:15px;
    background:#030712;
}

#rocket{
    position:absolute;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    font-size:60px;
}

.fly{
    animation:launch 5s linear forwards;
}

@keyframes launch{

    from{
        bottom:30px;
        transform:translateX(-50%);
    }

    to{
        bottom:430px;
        transform:translateX(-50%);
    }

}

.telemetry{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:20px;
}

.card{
    padding:18px;
    background:#081226;
    border:1px solid #263858;
    border-radius:12px;
}

.card small{
    display:block;
    color:#94a3b8;
    margin-bottom:8px;
}

.card strong{
    font-size:24px;
    color:#38bdf8;
}


/* MISSION LOG */

.log-panel{
    margin-top:20px;
    padding:18px;
    background:#081226;
    border:1px solid #263858;
    border-radius:12px;
    text-align:left;
}

.log-panel h2{
    margin-top:0;
    text-align:center;
}

#missionLog{
    height:180px;
    overflow-y:auto;
    background:#020617;
    border-radius:8px;
    padding:12px;
    font-family:monospace;
    font-size:14px;
}

.log-line{
    margin-bottom:8px;
    color:#9fffd3;
}


/* SUCCESS MESSAGE */

#success{
    display:none;
    margin-top:20px;
    padding:20px;
    background:#06351f;
    border:2px solid #00d084;
    border-radius:12px;
}

#success h2{
    color:#00ff99;
    margin-top:0;
}

#success p{
    color:#b7ffe0;
}


@media(max-width:500px){

    .telemetry{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<h1>
🚀 2060 MISSION CONTROL
</h1>


<div id="status">
SYSTEM READY
</div>


<div id="countdown"></div>


<button id="launchButton">
🚀 LAUNCH
</button>


<div id="space">

<div id="rocket">
🚀
</div>

</div>


<!-- TELEMETRY -->

<div class="telemetry">


<div class="card">

<small>
ALTITUDE
</small>

<strong>

<span id="altitude">
0
</span>

km

</strong>

</div>


<div class="card">

<small>
SPEED
</small>

<strong>

<span id="speed">
0
</span>

km/h

</strong>

</div>


</div>


<!-- SUCCESS -->

<div id="success">

<h2>
🛰️ MISSION SUCCESS
</h2>

<p>
ORBIT ACHIEVED
</p>

<p>
2060 SPACECRAFT IS NOW IN ORBIT
</p>

</div>


<!-- MISSION LOG -->

<div class="log-panel">

<h2>
📝 MISSION LOG
</h2>

<div id="missionLog">

<div class="log-line">
SYSTEM INITIALIZED
</div>

<div class="log-line">
VEHICLE READY
</div>

</div>

</div>


<script>


const button =
document.getElementById("launchButton");

const countdown =
document.getElementById("countdown");

const rocket =
document.getElementById("rocket");

const status =
document.getElementById("status");

const altitudeDisplay =
document.getElementById("altitude");

const speedDisplay =
document.getElementById("speed");

const missionLog =
document.getElementById("missionLog");

const success =
document.getElementById("success");


let altitude = 0;

let speed = 0;

let altitudeTimer = null;

let speedTimer = null;

let missionTimer = null;


function addLog(message){

const line =
document.createElement("div");

line.className =
"log-line";

line.innerText =
"[" +
new Date().toLocaleTimeString() +
"] " +
message;

missionLog.appendChild(line);

missionLog.scrollTop =
missionLog.scrollHeight;

}


button.onclick
