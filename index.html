<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>2060 Mission Control V2.5</title>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:Arial,sans-serif;
text-align:center;
padding:30px 15px;
}

h1{
font-size:26px;
}

#status{
font-size:20px;
font-weight:bold;
color:#00ff99;
margin:15px;
}

#countdown{
font-size:70px;
font-weight:bold;
color:#00ff99;
height:100px;
}

button{
background:#00d084;
color:#001b10;
border:0;
padding:18px 35px;
border-radius:10px;
font-size:20px;
font-weight:bold;
}

button:disabled{
opacity:.5;
}

#space{
height:500px;
margin-top:20px;
position:relative;
overflow:hidden;
border:2px solid #334155;
border-radius:15px;
background:#030712;
}

#rocket{
position:absolute;
left:50%;
bottom:30px;
transform:translateX(-50%);
font-size:60px;
}

.fly{
animation:launch 5s linear forwards;
}

@keyframes launch{

from{
bottom:30px;
transform:translateX(-50%);
}

to{
bottom:430px;
transform:translateX(-50%);
}

}

.telemetry{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:20px;
}

.card{
padding:18px;
background:#081226;
border:1px solid #263858;
border-radius:12px;
}

.card small{
display:block;
color:#94a3b8;
margin-bottom:8px;
}

.card strong{
font-size:24px;
color:#38bdf8;
}

.fuelBar{
height:10px;
background:#1e293b;
border-radius:10px;
margin-top:10px;
overflow:hidden;
}

#fuelBar{
height:100%;
width:100%;
background:#00d084;
}

#missionPanel{
margin-top:20px;
padding:18px;
background:#081226;
border:1px solid #263858;
border-radius:12px;
text-align:left;
}

#missionPanel h2{
text-align:center;
}

#missionLog{
height:160px;
overflow-y:auto;
background:#020617;
padding:12px;
border-radius:8px;
font-family:monospace;
font-size:14px;
}

.log{
margin-bottom:8px;
color:#9fffd3;
}

@media(max-width:500px){

.telemetry{
grid-template-columns:1fr;
}

}

</style>

</head>


<body>

<h1>
🚀 2060 MISSION CONTROL
</h1>


<div id="status">
SYSTEM READY
</div>


<div id="countdown"></div>


<button id="launchButton">
🚀 LAUNCH
</button>


<div id="space">

<div id="rocket">
🚀
</div>

</div>


<div class="telemetry">


<div class="card">

<small>
ALTITUDE
</small>

<strong>
<span id="altitude">0</span> km
</strong>

</div>


<div class="card">

<small>
SPEED
</small>

<strong>
<span id="speed">0</span> km/h
</strong>

</div>


<div class="card">

<small>
FUEL
</small>

<strong>
<span id="fuel">100</span> %
</strong>

<div class="fuelBar">

<div id="fuelBar"></div>

</div>

</div>


</div>


<div id="missionPanel">

<h2>
📝 MISSION LOG
</h2>

<div id="missionLog">

<div class="log">
SYSTEM INITIALIZED
</div>

<div class="log">
VEHICLE READY
</div>

</div>

</div>


<script>

const button =
document.getElementById("launchButton");

const countdown =
document.getElementById("countdown");

const rocket =
document.getElementById("rocket");

const status =
document.getElementById("status");

const altitudeDisplay =
document.getElementById("altitude");

const speedDisplay =
document.getElementById("speed");

const fuelDisplay =
document.getElementById("fuel");

const fuelBar =
document.getElementById("fuelBar");

const missionLog =
document.getElementById("missionLog");


let altitude = 0;

let speed = 0;

let fuel = 100;


function addLog(message){

const line =
document.createElement("div");

line.className =
"log";

line.innerText =
message;

missionLog.appendChild(line);

missionLog.scrollTop =
missionLog.scrollHeight;

}


button.onclick = function(){

button.disabled = true;

status.innerText =
"COUNTDOWN STARTED";

addLog(
"LAUNCH SEQUENCE STARTED"
);


let number = 3;

countdown.innerText =
number;


let timer =
setInterval(function(){

number--;


if(number > 0){

countdown.innerText =
number;

addLog(
"T-" + number
);

}


else{

clearInterval(timer);

countdown.innerText =
"🚀";

status.innerText =
"LIFTOFF!";


addLog(
"ENGINE IGNITION"
);

addLog(
"LIFTOFF CONFIRMED"
);


rocket.classList.remove("fly");

void rocket.offsetWidth;

rocket.classList.add("fly");


altitude = 0;

speed = 0;

fuel = 100;


altitudeDisplay.innerText =
"0";

speedDisplay.innerText =
"0";

fuelDisplay.innerText =
"100";

fuelBar.style.width =
"100%";


addLog(
"ASCENT PHASE STARTED"
);


/* ALTITUDE */

setInterval(function(){

altitude += 100;

altitudeDisplay.innerText =
altitude;

},1000);


/* SPEED */

setInterval(function(){

speed += 5000;

speedDisplay.innerText =
speed.toLocaleString();

},1000);


/* FUEL */

setInterval(function(){

fuel -= 2;

if(fuel < 0){

fuel = 0;

}

fuelDisplay.innerText =
fuel;

fuelBar.style.width =
fuel + "%";


if(fuel <= 20){

fuelBar.style.background =
"#ff4444";

}

},1000);

}

},1000);

};

</script>

</body>

</html>
